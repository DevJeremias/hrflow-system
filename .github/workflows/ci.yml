name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          # Banco descartável do job: a senha não protege nada além dele.
          MYSQL_ROOT_PASSWORD: ci-mysql-descartavel
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-descartavel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ci-mysql-descartavel
      DB_NAME: hrflow_ci
      JWT_SECRET: ci-segredo-jwt-com-pelo-menos-trinta-e-dois-bytes
      HRFLOW_TEST_DB_HOST: 127.0.0.1
      HRFLOW_TEST_DB_USER: root
      HRFLOW_TEST_DB_PASS: ci-mysql-descartavel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Schema reproduzível: migrations e fixtures da main aplicadas num banco novo.
      - name: Banco de dados (migrations e fixtures)
        run: npm run db:setup

      # Lint, typecheck, build e testes de backend em banco migrado.
      - run: npm run verify

  # Dependências de produção sem vulnerabilidade conhecida. Falha por advisory novo, não por mudança do PR.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev

  # Todo commit do PR segue Conventional Commits (commitlint.config.js).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
